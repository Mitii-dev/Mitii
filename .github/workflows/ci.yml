name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - run: pnpm install --frozen-lockfile
      - name: Check product package versions are synced
        run: pnpm run sync:versions -- --check
      - run: pnpm run release:check-assets
      - run: pnpm run typecheck
      - run: pnpm run rebuild:node
      - run: pnpm test
      - run: pnpm run check:architecture
      - run: pnpm run check:file-size
      - run: pnpm run check:circular-deps
      - run: pnpm run check:settings-catalog
      - run: pnpm run build:cli
      - run: pnpm run test:scripts
      - run: pnpm run build:vscode:prod
      - run: pnpm --filter mitii-ai-agent audit:package
      - run: pnpm run benchmark:validate
