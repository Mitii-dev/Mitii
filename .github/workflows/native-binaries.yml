name: VS Code native VSIX

on:
  workflow_dispatch:

jobs:
  package:
    name: package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: macos-13
            target: darwin-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install native build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - run: pnpm install --frozen-lockfile
      - run: pnpm run sync:versions -- --check
      - run: pnpm run typecheck
      - run: pnpm run rebuild:native
        env:
          MITII_ELECTRON_VERSION: 42.6.0
      - run: pnpm run package
        env:
          MITII_VSCODE_TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-vsix-${{ matrix.target }}
          path: dist-vsix/*.vsix
