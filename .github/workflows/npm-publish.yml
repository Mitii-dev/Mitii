# Publishes product npm packages in dependency order (see scripts/publish-npm.cjs):
# settings, ui-*, v8, search-kit, sdk, automation, mcp*, host, cli, daemon, acp.
# Invoked from the Release workflow, or manually via workflow_dispatch.
# VS Code Marketplace / Open VSX publish via Release → publish-marketplace.
# Prefers GitHub OIDC trusted publishing; NPM_TOKEN is optional fallback.
name: npm publish

on:
  workflow_dispatch:
  workflow_call:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Install npm trusted publishing support
        run: |
          npm install -g npm@^11.5.1
          node --version
          npm --version
          pnpm --version
      - name: Require publish auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -z "$NPM_TOKEN" ]; then
            echo "::error::No publish auth configured. Enable npm trusted publishing for this repo (recommended) or set NPM_TOKEN."
            exit 1
          fi
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - run: pnpm install --frozen-lockfile
      - name: Check product package versions are synced
        run: pnpm run sync:versions -- --check
      - run: pnpm run rebuild:node
      - run: pnpm run build
      - run: pnpm run check:architecture
      - name: Publish npm packages
        run: node scripts/publish-npm.cjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
